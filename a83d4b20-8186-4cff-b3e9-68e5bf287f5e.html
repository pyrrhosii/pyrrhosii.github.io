<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Accès</title>
<style>
  :root{
    --bg-0:#12161a;
    --bg-1:#181d22;
    --panel:#1e252b;
    --line:#2a333a;
    --ink:#e8ecef;
    --ink-dim:#8a9aa5;
    --amber:#e8a33d;
    --amber-dim:#8a6423;
    --err:#c85a4a;
    --moon:#3a3552;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    background:
      radial-gradient(circle at 82% 12%, rgba(58,53,82,0.55), transparent 32%),
      radial-gradient(circle at 50% 0%, var(--bg-1), var(--bg-0) 65%);
    color:#e8ecef;
    overflow:hidden;
    position:relative;
  }

  /* faint crescent moon, upper right of the viewport */
  .moon{
    position:fixed;
    top:8%; right:10%;
    width:46px; height:46px;
    border-radius:50%;
    background:var(--moon);
    opacity:0.55;
    box-shadow:-14px 4px 0 2px var(--bg-0);
    pointer-events:none;
  }

  /* a few faint stars scattered in the backdrop */
  .stars{
    position:fixed; inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 25%, rgba(232,236,239,0.35), transparent),
      radial-gradient(1.5px 1.5px at 75% 60%, rgba(232,236,239,0.25), transparent),
      radial-gradient(1px 1px at 60% 15%, rgba(232,236,239,0.3), transparent),
      radial-gradient(1px 1px at 30% 75%, rgba(232,236,239,0.2), transparent),
      radial-gradient(1.5px 1.5px at 88% 30%, rgba(232,236,239,0.25), transparent);
  }

  /* fine scanline / grain texture, very subtle */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .panel{
    position:relative;
    width:100%;
    max-width:380px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 28px 30px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .badge{
    position:relative;
    width:60px;
    height:60px;
    margin:0 auto 16px;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(232,163,61,0.35));
    animation:float 5s ease-in-out infinite;
  }
  .spark{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--amber);
    opacity:0;
    animation:spark 3.6s ease-in infinite;
  }
  .spark:nth-child(2){ left:6px;  bottom:8px;  animation-delay:.3s; }
  .spark:nth-child(3){ right:4px; bottom:14px; animation-delay:1.5s; }
  .spark:nth-child(4){ left:50%;  bottom:0;    animation-delay:2.5s; }

  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  @keyframes spark{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    15%{ opacity:0.9; }
    100%{ opacity:0; transform:translateY(-38px) scale(0.2); }
  }

  @media (prefers-reduced-motion: reduce){
    .badge img{ animation:none; }
    .spark{ animation:none; display:none; }
  }

  .led{
    width:8px; height:8px; border-radius:50%;
    background:var(--amber-dim);
    margin:0 auto 18px;
    box-shadow:0 0 0 3px rgba(232,163,61,0.08);
    transition:background .3s, box-shadow .3s;
  }
  .led.active{
    background:var(--amber);
    box-shadow:0 0 12px 2px rgba(232,163,61,0.55), 0 0 0 3px rgba(232,163,61,0.12);
  }
  .led.error{
    background:var(--err);
    box-shadow:0 0 12px 2px rgba(200,90,74,0.55), 0 0 0 3px rgba(200,90,74,0.12);
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  #question{
    font-size:16px;
    line-height:1.5;
    color:#e8ecef;
    margin:0 0 22px;
    font-weight:400;
  }

  .clue{
    margin:0 0 22px;
  }
  .clue img{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
    margin-bottom:12px;
  }
  .clue audio{
    width:100%;
    height:36px;
    filter:invert(0.9) sepia(0.3) saturate(2) hue-rotate(360deg);
  }
  .clue.empty{ display:none; }

  .boxes{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .boxes input{
    width:42px;
    height:52px;
    text-align:center;
    font-size:20px;
    font-family:inherit;
    font-weight:700;
    border-width:2px;
    border-style:solid;
    border-radius:8px;
    outline:none;
    transition:border-color .15s, box-shadow .15s, transform .1s;
  }
  .boxes input.c-green{
    color:#2e6b45; background:#cfead9; border-color:#3fae62; caret-color:#2e6b45;
  }
  .boxes input.c-blue{
    color:#28568a; background:#d2e6f8; border-color:#3f8fd6; caret-color:#28568a;
  }
  .boxes input.c-red{
    color:#9c3f3f; background:#f6d9d6; border-color:#d16a5f; caret-color:#9c3f3f;
  }
  .boxes input.c-yellow{
    color:#8a6d1f; background:#faf0c4; border-color:#d6b23f; caret-color:#8a6d1f;
  }
  .boxes input:focus{
    transform:translateY(-2px);
    box-shadow:0 4px 10px -2px rgba(0,0,0,0.35);
  }
  .boxes.shake{ animation:shake .4s; }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }

  #hint{
    min-height:18px;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:6px;
    letter-spacing:0.02em;
  }
  #hint.error{ color:var(--err); }
  #hint.success{ color:var(--amber); }

  .footer-mark{
    margin-top:26px;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#3d4750;
  }

  #success-view{
    display:none;
  }
  #success-view.show{ display:block; }
  #gate-view.hide{ display:none; }

  #success-message{
    font-size:16px;
    line-height:1.6;
    color:#e8ecef;
    white-space:pre-line;
  }

  @media (prefers-reduced-motion: reduce){
    .boxes.shake{ animation:none; }
  }
</style>
</head>

<div class="stars"></div>

    <div class="led active" style="margin-bottom:18px;"></div>
    <p class="eyebrow">Accès au témoignage validé</p>
    <div class="clue" id="clue">
      <img id="clue-img" alt="">
      <audio id="clue-audio" controls preload="none"></audio>
    </div>
    <p id="success-message"></p>
  </div>

  <p class="footer-mark">···</p>
</div>

<script>
/* ============================================================
   CONFIGURATION — à modifier avant de déployer
   ============================================================ */
const CONFIG = {
  // La question / consigne affichée au-dessus des cases
  QUESTION: "Quel est le mot de passe ?",

  // Texte d'aide affiché sous les cases (placeholder), tant qu'aucune
  // erreur n'a eu lieu
  PLACEHOLDER: "Entrez le code à 4 caractères",

  // Photo servant d'indice, affichée entre la question et les cases.
  // Chemin relatif vers un fichier placé à côté de index.html sur
  // GitHub Pages (ex : "photo.jpg"). Laisser vide "" pour ne rien
  // afficher.
  IMAGE_SRC: "photo.jpg",
  IMAGE_ALT: "Indice photo",

  // Fichier audio servant d'indice, lecteur intégré. Chemin relatif
  // de la même façon (ex : "indice.mp3"). Laisser vide "" pour ne
  // rien afficher.
  AUDIO_SRC: "indice.mp3",

  // Nombre de cases (= longueur du code attendu)
  LENGTH: 4,

  // Le code n'est jamais stocké en clair : on stocke le hash SHA-256
  // (en minuscules, en hexadécimal) du code attendu.
  // Pour le générer : ouvrez la console du navigateur sur n'importe
  // quelle page et tapez, par exemple pour le code "4210" :
  //
  //   crypto.subtle.digest("SHA-256", new TextEncoder().encode("4210"))
  //     .then(b => console.log([...new Uint8Array(b)]
  //       .map(x => x.toString(16).padStart(2,"0")).join("")))
  //
  // puis collez le résultat ci-dessous.
  // Valeur ci-dessous = hash de "0000", fourni uniquement à titre de
  // démo pour que la page fonctionne telle quelle. Remplacez-la.
  CODE_HASH: "920232613e4a67a07d6c99b7974dbcd6765ee171da73e4961e1499a05a1f471b",

  // Si CASE_SENSITIVE est false, le code est comparé en majuscules
  // (utile si le code contient des lettres)
  CASE_SENSITIVE: false,

  // Message affiché une fois le bon code entré
  SUCCESS_MESSAGE: "Bienvenue.",

  // Si renseigné, redirige automatiquement vers cette URL après le
  // succès (laisser vide "" pour rester sur le message ci-dessus)
  REDIRECT_URL: "",

  // Délai avant redirection, en millisecondes
  REDIRECT_DELAY: 1200
};
/* ============================================================ */

const boxesEl = document.getElementById('boxes');
const hintEl = document.getElementById('hint');
const ledEl = document.getElementById('led');
const questionEl = document.getElementById('question');
const gateView = document.getElementById('gate-view');
const successView = document.getElementById('success-view');
const successMessageEl = document.getElementById('success-message');
const clueEl = document.getElementById('clue');
const clueImgEl = document.getElementById('clue-img');
const clueAudioEl = document.getElementById('clue-audio');

questionEl.textContent = CONFIG.QUESTION;
hintEl.textContent = CONFIG.PLACEHOLDER;
successMessageEl.textContent = CONFIG.SUCCESS_MESSAGE;

// Photo indice : affichée seulement si IMAGE_SRC est renseigné et
// que le fichier se charge correctement
if (CONFIG.IMAGE_SRC) {
  clueImgEl.alt = CONFIG.IMAGE_ALT || '';
  clueImgEl.src = CONFIG.IMAGE_SRC;
  clueImgEl.addEventListener('error', () => { clueImgEl.style.display = 'none'; });
} else {
  clueImgEl.style.display = 'none';
}

// Audio indice : lecteur natif, affiché seulement si AUDIO_SRC est
// renseigné
if (CONFIG.AUDIO_SRC) {
  clueAudioEl.src = CONFIG.AUDIO_SRC;
} else {
  clueAudioEl.style.display = 'none';
}

if (!CONFIG.IMAGE_SRC && !CONFIG.AUDIO_SRC) {
  clueEl.classList.add('empty');
}

// Construction des cases
const BOX_COLORS = ['c-green', 'c-blue', 'c-red', 'c-yellow'];
const inputs = [];
for (let i = 0; i < CONFIG.LENGTH; i++) {
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.inputMode = 'text';
  inp.autocomplete = 'off';
  inp.autocapitalize = 'off';
  inp.spellcheck = false;
  inp.maxLength = 1;
  inp.classList.add(BOX_COLORS[i % BOX_COLORS.length]);
  inp.setAttribute('aria-label', 'Caractère ' + (i + 1));
  boxesEl.appendChild(inp);
  inputs.push(inp);
}

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function currentCode() {
  return inputs.map(i => i.value).join('');
}

function setError(msg) {
  hintEl.textContent = msg;
  hintEl.className = 'error';
  ledEl.className = 'led error';
  boxesEl.classList.remove('shake');
  void boxesEl.offsetWidth; // reflow pour rejouer l'animation
  boxesEl.classList.add('shake');
}

function resetHint() {
  hintEl.textContent = CONFIG.PLACEHOLDER;
  hintEl.className = '';
  ledEl.className = 'led';
}

async function tryValidate() {
  const code = currentCode();
  if (code.length < CONFIG.LENGTH) return;

  const normalized = CONFIG.CASE_SENSITIVE ? code : code.toUpperCase();
  const hash = await sha256Hex(normalized);

  if (hash === CONFIG.CODE_HASH) {
    ledEl.className = 'led active';
    hintEl.textContent = '';
    gateView.classList.add('hide');
    successView.classList.add('show');
    if (CONFIG.REDIRECT_URL) {
      setTimeout(() => { window.location.href = CONFIG.REDIRECT_URL; }, CONFIG.REDIRECT_DELAY);
    }
  } else {
    setError('Code incorrect');
    setTimeout(() => {
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
      resetHint();
    }, 550);
  }
}

inputs.forEach((inp, idx) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.slice(-1);
    if (inp.value && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
    }
    if (hintEl.className === 'error') resetHint();
    tryValidate();
  });

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !inp.value && idx > 0) {
      inputs[idx - 1].focus();
    }
  });

  inp.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text').trim();
    if (!text) return;
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].value = text[i] || '';
    }
    const last = Math.min(text.length, inputs.length) - 1;
    if (last >= 0) inputs[last].focus();
    tryValidate();
  });
});

inputs[0].focus();
</script>

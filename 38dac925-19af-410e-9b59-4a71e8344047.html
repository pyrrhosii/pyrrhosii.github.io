<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Accès</title>
<style>
  :root{
    --bg-0:#12161a;
    --bg-1:#181d22;
    --panel:#1e252b;
    --line:#2a333a;
    --ink:#e8ecef;
    --ink-dim:#8a9aa5;
    --amber:#e8a33d;
    --amber-dim:#8a6423;
    --err:#c85a4a;
    --moon:#3a3552;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace;
    background:
      radial-gradient(circle at 82% 12%, rgba(58,53,82,0.55), transparent 32%),
      radial-gradient(circle at 50% 0%, var(--bg-1), var(--bg-0) 65%);
    color:#e8ecef;
    overflow:hidden;
    position:relative;
  }

  /* faint crescent moon, upper right of the viewport */
  .moon{
    position:fixed;
    top:8%; right:10%;
    width:46px; height:46px;
    border-radius:50%;
    background:var(--moon);
    opacity:0.55;
    box-shadow:-14px 4px 0 2px var(--bg-0);
    pointer-events:none;
  }

  /* a few faint stars scattered in the backdrop */
  .stars{
    position:fixed; inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 25%, rgba(232,236,239,0.35), transparent),
      radial-gradient(1.5px 1.5px at 75% 60%, rgba(232,236,239,0.25), transparent),
      radial-gradient(1px 1px at 60% 15%, rgba(232,236,239,0.3), transparent),
      radial-gradient(1px 1px at 30% 75%, rgba(232,236,239,0.2), transparent),
      radial-gradient(1.5px 1.5px at 88% 30%, rgba(232,236,239,0.25), transparent);
  }

  /* fine scanline / grain texture, very subtle */
  body::before{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .panel{
    position:relative;
    width:100%;
    max-width:400px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:36px 24px 30px;
    text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .badge{
    position:relative;
    width:60px;
    height:60px;
    margin:0 auto 16px;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(232,163,61,0.35));
    animation:float 5s ease-in-out infinite;
  }
  .spark{
    position:absolute;
    width:3px; height:3px;
    border-radius:50%;
    background:var(--amber);
    opacity:0;
    animation:spark 3.6s ease-in infinite;
  }
  .spark:nth-child(2){ left:6px;  bottom:8px;  animation-delay:.3s; }
  .spark:nth-child(3){ right:4px; bottom:14px; animation-delay:1.5s; }
  .spark:nth-child(4){ left:50%;  bottom:0;    animation-delay:2.5s; }

  @keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  @keyframes spark{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    15%{ opacity:0.9; }
    100%{ opacity:0; transform:translateY(-38px) scale(0.2); }
  }

  @media (prefers-reduced-motion: reduce){
    .badge img{ animation:none; }
    .spark{ animation:none; display:none; }
  }

  .led{
    width:8px; height:8px; border-radius:50%;
    background:var(--amber-dim);
    margin:0 auto 18px;
    box-shadow:0 0 0 3px rgba(232,163,61,0.08);
    transition:background .3s, box-shadow .3s;
  }
  .led.active{
    background:var(--amber);
    box-shadow:0 0 12px 2px rgba(232,163,61,0.55), 0 0 0 3px rgba(232,163,61,0.12);
  }
  .led.error{
    background:var(--err);
    box-shadow:0 0 12px 2px rgba(200,90,74,0.55), 0 0 0 3px rgba(200,90,74,0.12);
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 14px;
  }

  #question{
    font-size:16px;
    line-height:1.5;
    color:#e8ecef;
    margin:0 0 22px;
    font-weight:400;
  }

  .clue{
    margin:0 0 22px;
  }
  .clue img{
    display:block;
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
    margin-bottom:12px;
  }
  .clue audio{
    width:100%;
    height:36px;
    filter:invert(0.9) sepia(0.3) saturate(2) hue-rotate(360deg);
  }
  .clue.empty{ display:none; }

  .groups{
    display:flex;
    gap:8px;
    justify-content:center;
    align-items:flex-start;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .group{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:96px;
  }
  .group-boxes{
    display:flex;
    gap:4px;
  }
  .group-boxes input{
    width:28px;
    height:44px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    font-family:inherit;
    color:var(--amber);
    background:var(--bg-0);
    border:1px solid var(--line);
    border-radius:7px;
    outline:none;
    caret-color:var(--amber);
    transition:border-color .15s, box-shadow .15s;
  }
  .group-boxes input:focus{
    border-color:var(--amber);
    box-shadow:0 0 0 3px rgba(232,163,61,0.15);
  }
  .group-vial{
    width:44px;
    height:auto;
    margin-top:10px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4));
  }
  .group-label{
    margin-top:6px;
    font-size:11px;
    color:var(--ink-dim);
    line-height:1.3;
  }

  .date-sep{
    align-self:flex-start;
    height:44px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:700;
    color:var(--ink-dim);
    padding:0 1px;
  }

  .groups.shake{ animation:shake .4s; }
  @keyframes shake{
    10%,90%{ transform:translateX(-1px); }
    20%,80%{ transform:translateX(2px); }
    30%,50%,70%{ transform:translateX(-4px); }
    40%,60%{ transform:translateX(4px); }
  }

  #hint{
    min-height:18px;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:14px;
    letter-spacing:0.02em;
  }
  #hint.error{ color:var(--err); }
  #hint.success{ color:var(--amber); }

  .footer-mark{
    margin-top:26px;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:#3d4750;
  }

  #success-view{
    display:none;
  }
  #success-view.show{ display:block; }
  #gate-view.hide{ display:none; }

  #success-message{
    font-size:16px;
    line-height:1.6;
    color:#e8ecef;
    white-space:pre-line;
  }

  @media (prefers-reduced-motion: reduce){
    .groups.shake{ animation:none; }
  }
</style>
</head>

<div class="stars"></div>

const groupsEl = document.getElementById('groups');
const hintEl = document.getElementById('hint');
const ledEl = document.getElementById('led');
const questionEl = document.getElementById('question');
const gateView = document.getElementById('gate-view');
const successView = document.getElementById('success-view');
const successMessageEl = document.getElementById('success-message');
const clueEl = document.getElementById('clue');
const clueImgEl = document.getElementById('clue-img');
const clueAudioEl = document.getElementById('clue-audio');

questionEl.textContent = CONFIG.QUESTION;
hintEl.textContent = CONFIG.PLACEHOLDER;
successMessageEl.textContent = CONFIG.SUCCESS_MESSAGE;

// Photo indice : affichée seulement si IMAGE_SRC est renseigné et
// que le fichier se charge correctement
if (CONFIG.IMAGE_SRC) {
  clueImgEl.alt = CONFIG.IMAGE_ALT || '';
  clueImgEl.src = CONFIG.IMAGE_SRC;
  clueImgEl.addEventListener('error', () => { clueImgEl.style.display = 'none'; });
} else {
  clueImgEl.style.display = 'none';
}

// Audio indice : lecteur natif, affiché seulement si AUDIO_SRC est
// renseigné
if (CONFIG.AUDIO_SRC) {
  clueAudioEl.src = CONFIG.AUDIO_SRC;
} else {
  clueAudioEl.style.display = 'none';
}

if (!CONFIG.IMAGE_SRC && !CONFIG.AUDIO_SRC) {
  clueEl.classList.add('empty');
}

// Construction des groupes (2 cases + fiole + libellé), avec un
// séparateur "/" entre chaque groupe
const CHARS_PER_GROUP = 2;
const groupInputs = []; // groupInputs[groupIndex] = [input0, input1]
let groupBoxesEls = [];

CONFIG.GROUPS.forEach((group, g) => {
  if (g > 0) {
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.textContent = '/';
    sep.setAttribute('aria-hidden', 'true');
    groupsEl.appendChild(sep);
  }

  const root = document.createElement('div');
  root.className = 'group';

  const boxes = document.createElement('div');
  boxes.className = 'group-boxes';

  const inputsForGroup = [];
  for (let c = 0; c < CHARS_PER_GROUP; c++) {
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.autocomplete = 'off';
    inp.autocapitalize = 'off';
    inp.spellcheck = false;
    inp.maxLength = 1;
    inp.setAttribute('aria-label', group.label + ', chiffre ' + (c + 1));
    boxes.appendChild(inp);
    inputsForGroup.push(inp);
  }
  root.appendChild(boxes);
  groupInputs.push(inputsForGroup);
  groupBoxesEls.push(boxes);

  if (CONFIG.VIAL_IMAGE) {
    const vial = document.createElement('img');
    vial.className = 'group-vial';
    vial.src = CONFIG.VIAL_IMAGE;
    vial.alt = group.label;
    root.appendChild(vial);
  }

  if (group.label) {
    const label = document.createElement('p');
    label.className = 'group-label';
    label.textContent = group.label;
    root.appendChild(label);
  }

  groupsEl.appendChild(root);
});

// Liste à plat, dans l'ordre, pour la navigation (tab automatique,
// retour arrière, collage)
const inputs = groupInputs.flat();
const LENGTH = inputs.length;

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

function resetHint() {
  hintEl.textContent = CONFIG.PLACEHOLDER;
  hintEl.className = '';
  ledEl.className = 'led';
}

function shakeAll() {
  groupsEl.classList.remove('shake');
  void groupsEl.offsetWidth; // reflow pour rejouer l'animation
  groupsEl.classList.add('shake');
}

// Un groupe est valide si son hash correspond à exact, minus ou plus
async function groupIsValid(g) {
  const [a, b] = groupInputs[g];
  const value = a.value + b.value;
  const hash = await sha256Hex(value);
  const hashes = CONFIG.GROUPS[g].hashes;
  return hash === hashes.exact
    || (hashes.minus && hash === hashes.minus)
    || (hashes.plus && hash === hashes.plus);
}

async function tryValidate() {
  const allFilled = inputs.every(i => i.value !== '');
  if (!allFilled) return; // on ne valide qu'une fois les 6 chiffres remplis

  const results = await Promise.all(CONFIG.GROUPS.map((_, g) => groupIsValid(g)));
  const allValid = results.every(Boolean);

  if (allValid) {
    ledEl.className = 'led active';
    hintEl.textContent = '';
    gateView.classList.add('hide');
    successView.classList.add('show');
    if (CONFIG.REDIRECT_URL) {
      setTimeout(() => { window.location.href = CONFIG.REDIRECT_URL; }, CONFIG.REDIRECT_DELAY);
    }
  } else {
    ledEl.className = 'led error';
    shakeAll();
    hintEl.textContent = 'Code incorrect';
    hintEl.className = 'error';
    setTimeout(() => {
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
      resetHint();
    }, 550);
  }
}

inputs.forEach((inp, idx) => {
  inp.addEventListener('input', () => {
    inp.value = inp.value.slice(-1);
    if (inp.value && idx < inputs.length - 1) {
      inputs[idx + 1].focus();
    }
    if (hintEl.className === 'error') resetHint();
    tryValidate();
  });

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !inp.value && idx > 0) {
      inputs[idx - 1].focus();
    }
  });

  inp.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
    if (!text) return;
    for (let i = 0; i < inputs.length; i++) {
      inputs[i].value = text[i] || '';
    }
    const last = Math.min(text.length, inputs.length) - 1;
    if (last >= 0) inputs[last].focus();
    tryValidate();
  });
});

inputs[0].focus();
